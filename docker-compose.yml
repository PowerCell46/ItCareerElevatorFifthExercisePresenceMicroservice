services:
  # MongoDB
  mongo_db:
    image: mongo:7-jammy
    container_name: user_presence_mongo_db
    environment:
      MONGO_INITDB_DATABASE: presence_db
    ports:
      - "27018:27017"
    volumes:
      - user_presence_vol_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_presence_server
    ports:
      - "8084:8084"
    environment:
      # Override application.properties for container networking
      SPRING_MONGO_DB_URI: mongodb://mongo_db:27017/presence_db
    depends_on:
      mongo_db:
        condition: service_healthy

volumes:
  user_presence_vol_db: